<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataViz – XLS Visualizer</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- SheetJS for XLS/XLSX parsing -->
  <script src="vendor/xlsx.full.min.js"></script>
  <!-- Chart.js for visualizations -->
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      <span class="brand-name">DataViz</span>
    </div>
    <div class="header-actions">
      <button id="themeToggle" class="btn btn-ghost" aria-label="Toggle theme">
        <svg class="icon" id="sunIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon hidden" id="moonIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="main">

    <!-- UPLOAD SECTION -->
    <section id="uploadSection" class="upload-section">
      <div class="upload-hero">
        <h1 class="hero-title">Visualize Your Data</h1>
        <p class="hero-subtitle">Upload an XLS or XLSX file and explore your data through beautiful, interactive charts.</p>
      </div>

      <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Upload XLS or XLSX file">
        <div class="drop-zone-inner">
          <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <p class="drop-text">Drag &amp; drop your file here</p>
          <p class="drop-subtext">or</p>
          <button class="btn btn-primary" id="browseBtn">Browse Files</button>
          <p class="drop-hint">Supports .xls and .xlsx files</p>
        </div>
        <input type="file" id="fileInput" accept=".xls,.xlsx" hidden />
      </div>

      <!-- Sample data button -->
      <div class="sample-section">
        <p class="sample-text">Don't have a file? <button class="btn-link" id="loadSample">Load sample data</button></p>
      </div>
    </section>

    <!-- VISUALIZATION SECTION (hidden until file loaded) -->
    <section id="vizSection" class="viz-section hidden">

      <!-- File info bar -->
      <div class="file-info-bar">
        <div class="file-badge">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span id="fileName">data.xlsx</span>
        </div>
        <div class="file-stats">
          <span id="rowCount" class="stat-badge">0 rows</span>
          <span id="colCount" class="stat-badge">0 columns</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="resetBtn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-4.46"/>
          </svg>
          New File
        </button>
      </div>

      <!-- Sheet selector (if multiple sheets) -->
      <div id="sheetSelector" class="sheet-selector hidden">
        <label class="control-label" for="sheetSelect">Sheet:</label>
        <select id="sheetSelect" class="select"></select>
      </div>

      <!-- Controls bar -->
      <div class="controls-bar">
        <!-- Visualization style tabs -->
        <div class="control-group">
          <span class="control-label">Style</span>
          <div class="tab-group" role="tablist">
            <button class="tab active" data-style="dashboard" role="tab" aria-selected="true" title="Dashboard – multiple mini charts">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              </svg>
              Dashboard
            </button>
            <button class="tab" data-style="focus" role="tab" aria-selected="false" title="Focus – single large chart">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2"/>
                <line x1="8" y1="21" x2="16" y2="21"/>
                <line x1="12" y1="17" x2="12" y2="21"/>
              </svg>
              Focus
            </button>
            <button class="tab" data-style="compare" role="tab" aria-selected="false" title="Compare – side-by-side charts">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="9" height="18" rx="1"/>
                <rect x="13" y="3" width="9" height="18" rx="1"/>
              </svg>
              Compare
            </button>
          </div>
        </div>

        <!-- Chart type selector -->
        <div class="control-group" id="chartTypeGroup">
          <span class="control-label">Chart</span>
          <div class="chip-group" id="chartTypeChips">
            <button class="chip active" data-chart="bar">Bar</button>
            <button class="chip" data-chart="line">Line</button>
            <button class="chip" data-chart="pie">Pie</button>
            <button class="chip" data-chart="radar">Radar</button>
            <button class="chip" data-chart="scatter">Scatter</button>
            <button class="chip" data-chart="polarArea">Polar</button>
          </div>
        </div>

        <!-- Column pickers -->
        <div class="control-group" id="columnPickers">
          <div class="picker-row">
            <label class="control-label" for="xAxisCol">X Axis / Labels</label>
            <select id="xAxisCol" class="select select-sm"></select>
          </div>
          <div class="picker-row" id="yAxisGroup">
            <label class="control-label">Y Axis / Values</label>
            <div id="yAxisCols" class="checkbox-group"></div>
          </div>
        </div>
      </div>

      <!-- Canvas area -->
      <div id="chartArea" class="chart-area"></div>

      <!-- Data table toggle -->
      <div class="table-section">
        <button class="btn btn-ghost btn-sm" id="tableToggle">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2V9M9 21H5a2 2 0 0 0-2-2V9m0 0h18"/>
          </svg>
          Show Data Table
        </button>
        <div id="tableWrapper" class="table-wrapper hidden">
          <div class="table-scroll">
            <table id="dataTable" class="data-table"></table>
          </div>
        </div>
      </div>

    </section>
  </main>

  <!-- Toast notifications -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
